version: '3.8'

services:
  bot:
    build: .
    container_name: toy-terrier-bot
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    environment:
      - CONFIG_PATH=/app/config.yaml
    networks:
      - toy-terrier-network

  postgres:
    image: postgres:15-alpine
    container_name: toy-terrier-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: toy_terrier
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - toy-terrier-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: toy-terrier-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - toy-terrier-network

volumes:
  postgres_data:

networks:
  toy-terrier-network:
    driver: bridge
